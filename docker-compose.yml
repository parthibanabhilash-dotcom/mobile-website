services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mobile_shop
      POSTGRES_USER: mobile
      POSTGRES_PASSWORD: mobile_local
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobile -d mobile_shop"]
      interval: 5s
      retries: 10
  mail:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
volumes:
  postgres_data:
