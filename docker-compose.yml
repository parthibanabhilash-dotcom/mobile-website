services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mobile_shop
      MYSQL_USER: mobile
      MYSQL_PASSWORD: mobile_local
      MYSQL_ROOT_PASSWORD: root_local_development_only
    command: ['--default-time-zone=+00:00']
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      retries: 10
  mail:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
volumes:
  mysql_data:
